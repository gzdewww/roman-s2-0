<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 600" width="2400" height="600" role="img" aria-label="Roman's — restaurant logo">
  <defs>
    <style><![CDATA[
      :root{
        --text: #0b0b0b;        /* основной цвет текста */
        --accent: #b08856;      /* золотой/акцентный */
        --stroke: #6b4f36;      /* более тёмный акцент для штрихов */
        --muted: transparent;   /* фон — прозрачный */
      }
      .logo-text { fill: var(--text); font-family: "Georgia", "Times New Roman", serif; font-weight: 700; font-size:220px; letter-spacing:-6px; }
      .icon-fill { fill: var(--accent); stroke: none; }
      .icon-stroke { fill: none; stroke: var(--stroke); stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
      .icon-accent-stroke { fill: none; stroke: var(--accent); stroke-width:12; stroke-linecap:round; stroke-linejoin:round; }
      .icon-outline { fill:none; stroke:var(--stroke); stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
      .tagline { fill: var(--stroke); font-family: "Helvetica Neue", Arial, sans-serif; font-size:42px; letter-spacing:2px; }
    ]]></style>
  </defs>

  <!-- Transparent background for clean export -->
  <rect width="100%" height="100%" fill="var(--muted)" />

  <!-- ICON GROUP: globe + chef hat + utensils (left side) -->
  <g id="icon" transform="translate(120,300)">
    <!-- Globe base -->
    <g id="globe" transform="translate(0,0)">
      <circle cx="0" cy="0" r="140" class="icon-accent-stroke" />
      <!-- latitude/longitude grid -->
      <g class="icon-outline">
        <path d="M-140,0h280" />
        <path d="M0,-140v280" />
        <path d="M-110,-80c40,80 70,80 110,80" />
        <path d="M-110,80c40,-80 70,-80 110,-80" />
      </g>
      <!-- simplified continents (stylized, editable) -->
      <path class="icon-fill" d="M-30,-20c-36,6 -70,30 -82,64c-8,24 0,50 20,64c22,16 48,8 76,4c18,-2 36,-10 56,-28c6,-8 10,-20 6,-34c-14,-44 -30,-76 -92,-70z" />
      <path class="icon-fill" d="M60,-10c18,8 34,24 40,48c6,28 -2,58 -28,72c-16,10 -34,6 -52,-2c18,-30 28,-66 40,-118z" />
    </g>

    <!-- Chef hat perched above globe -->
    <g id="chef-hat" transform="translate(0,-190) scale(1)">
      <path class="icon-fill" d="M-100,50c-6,-36 20,-80 82,-76c44,3 74,30 74,62c0,9 -6,16 -12,22c-10,10 -26,22 -42,22c-12,0 -24,-6 -36,-6c-10,0 -24,6 -36,6c-16,0 -30,-12 -30,-32z" />
      <rect x="-86" y="48" width="172" height="22" rx="8" class="icon-accent-stroke" />
    </g>

    <!-- Utensils: fork + spoon crossed to the right of globe -->
    <g id="utensils" transform="translate(220,10) rotate(-15)">
      <!-- fork -->
      <path class="icon-stroke" d="M0,-120v150" stroke-width="14"/>
      <path class="icon-stroke" d="M-10,-120h20" stroke-width="10"/>
      <path class="icon-stroke" d="M-10,-92h20" stroke-width="10"/>
      <path class="icon-stroke" d="M-10,-64h20" stroke-width="10"/>
      <rect x="-12" y="30" width="24" height="90" rx="10" class="icon-stroke" stroke-width="12"/>
      <!-- spoon -->
      <g transform="translate(90,40) rotate(30)">
        <path class="icon-stroke" d="M0,-120v110" stroke-width="12"/>
        <ellipse cx="0" cy="10" rx="28" ry="40" class="icon-stroke" stroke-width="12"/>
      </g>
    </g>
  </g>

  <!-- HORIZONTAL GAP between icon and text -->
  <!-- Text block: Roman's -->
  <g id="text-block" transform="translate(460,360)">
    <text class="logo-text" x="0" y="0">Roman's</text>
    <!-- Optional small tagline (editable) -->
    <text class="tagline" x="0" y="80">World cuisines — Mastered by chefs</text>
  </g>

  <!-- Grouping for easy selection in editors -->
  <g id="groups" style="display:none">
    <g id="g-globe" />
    <g id="g-hat" />
    <g id="g-utensils" />
    <g id="g-text" />
  </g>
</svg>
